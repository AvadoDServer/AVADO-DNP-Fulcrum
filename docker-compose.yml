version: '3.4'
services:
  fulcrum.avado.dnp.dappnode.eth:
    image: 'fulcrum.avado.dnp.dappnode.eth:0.1.0'
    build:
      context: .
      dockerfile: build/Dockerfile
    volumes:
      - 'fulcrum:/data'
    ports:
      - '50001:50001'
      - '50002:50002'
    environment:
      - DB_MEM_MB=2048
    restart: always
volumes:
  fulcrum: {}
